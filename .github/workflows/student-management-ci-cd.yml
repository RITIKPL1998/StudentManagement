name: Student Management CI/CD

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest

    env:
      PROJECT: StudentManagementConsoleApplication.csproj

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore project
        run: dotnet restore "$PROJECT"

      - name: Build project
        run: dotnet build "$PROJECT" --configuration Release --no-restore

      - name: Publish project
        if: github.event_name != 'pull_request'
        run: dotnet publish "$PROJECT" --configuration Release --no-build --no-restore --output "$RUNNER_TEMP/student-management-publish"

      - name: Upload published application
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: StudentManagementConsoleApplication-${{ github.sha }}
          path: ${{ runner.temp }}/student-management-publish
          if-no-files-found: error